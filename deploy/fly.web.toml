app = "science-ladder"
primary_region = "sjc"
kill_signal = "SIGTERM"

[build]
  dockerfile = "Dockerfile.web"
  [build.args]
    API_URL = "http://science-ladder-api.internal:8080"

[env]
  API_URL = "http://science-ladder-api.internal:8080"
  PORT = "8080"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
