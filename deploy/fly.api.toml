app = "science-ladder-api"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.api"

[env]
  DEPLOYMENT_MODE = "controlled-demo"
  LISTEN_ADDR = ":8080"
  PUBLIC_ORIGIN = "https://science-ladder.fly.dev"
  OPERATOR_GITHUB_ID = "60949391"
  OPENAI_REVIEW_MODEL = "gpt-6-astra"
  S3_BUCKET = "science-ladder-cas"
  S3_REGION = "auto"
  S3_ENDPOINT = "https://t3.storage.dev"
  RUNNER_LISTEN_ADDR = ":8443"
  RUNNER_TLS_CERT = "/app/runner-server.crt"
  RUNNER_TLS_KEY = "/app/runner-server.key"

[[files]]
  guest_path = "/app/runner-server.crt"
  secret_name = "RUNNER_TLS_CERT_B64"
  processes = ["api"]

[[files]]
  guest_path = "/app/runner-server.key"
  secret_name = "RUNNER_TLS_KEY_B64"
  processes = ["api"]

[processes]
  api = "/app/api"
  worker = "/app/worker"

[deploy]
  release_command = "/app/api migrate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["api", "worker"]

# Raw TCP preserves TLS 1.3 client-certificate verification in the Go service.
[[services]]
  protocol = "tcp"
  internal_port = 8443
  processes = ["api"]
  [[services.ports]]
    port = 8443
    handlers = []
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
