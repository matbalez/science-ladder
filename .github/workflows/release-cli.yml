name: Release CLI
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CLI release tag
        required: true
        default: cli-v0.3.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
      - run: go test ./cmd/sl ./pkg/protocol
      - name: Build binaries
        run: python3 scripts/build-cli-release.py "${RELEASE_TAG#cli-v}" dist/cli
      - name: Smoke test Linux binary
        run: dist/cli/sl_linux_amd64 version && dist/cli/sl_linux_amd64 --help
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/cli/* --verify-tag --title "Science Ladder CLI ${RELEASE_TAG#cli-v}" --generate-notes
